[project]
name = "cortexflow-core"
version = "0.1.0"
description = "CortexFlow Shared Core"
requires-python = ">=3.11"
dependencies = [
    "langchain-openai>=0.3.0",
    "langchain-core>=0.3.0",
    "httpx>=0.28.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "rich>=13.0",
    "python-dotenv>=1.0",
    "trafilatura>=2.0.0",
    "loguru>=0.7.3",
    "tenacity>=9.1.4",
    "sqlalchemy>=2.0.50",
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "psycopg2-binary>=2.9.12",
    "apprise>=1.11.0",
    "fake-useragent>=2.2.0",
    "datasketch>=1.10.0",
]

[tool.uv]
package = true

[tool.setuptools]
packages = ["cortexflow"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6.0",
    "pyright>=1.1.300",
    "pytest-httpx>=0.35.0",
    "respx>=0.22.0",
    "aiosqlite>=0.22.1",
    "testcontainers[postgres]>=4.14.2",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "ARG", "ANN", "D", "S", "BLE", "FBT", "A", "COM", "C4", "DTZ", "T20", "Q", "RET", "SLF", "TID", "TCH", "PT", "ERA", "RUF100"]
ignore = ["COM812"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG", "ANN", "D", "S", "SLF"]
"migrations/*" = ["D100", "D104", "E402", "D415"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
include = ["cortexflow"]
typeCheckingMode = "strict"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
