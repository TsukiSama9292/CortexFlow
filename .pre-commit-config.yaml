repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.0
    hooks:
      - id: ruff
        args: [ --fix ]
      - id: ruff-format

  - repo: https://github.com/biomejs/pre-commit
    rev: v0.6.0
    hooks:
      - id: biome-check
        additional_dependencies: ["@biomejs/biome@2.4.16"]

  - repo: local
    hooks:
      - id: turbo-type-check
        name: turbo-type-check
        entry: npm run type-check
        language: system
        pass_filenames: false

      - id: turbo-test
        name: turbo-test
        entry: npm run test
        language: system
        pass_filenames: false
        stages: [manual, push] # 測試通常較慢，可改為只在 push 或手動時執行，或保留在 commit
