apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "contexflow.fullname" . }}-db
  labels:
    {{- include "contexflow.labels" . | nindent 4 }}
    component: db
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "contexflow.selectorLabels" . | nindent 6 }}
      component: db
  template:
    metadata:
      labels:
        {{- include "contexflow.selectorLabels" . | nindent 8 }}
        component: db
    spec:
      containers:
        - name: db
          image: "{{ .Values.database.image.repository }}:{{ .Values.database.image.tag }}"
          imagePullPolicy: {{ .Values.database.image.pullPolicy }}
          env:
            - name: POSTGRES_DB
              value: {{ .Values.database.auth.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.database.auth.username | quote }}
            - name: POSTGRES_PASSWORD
              value: {{ .Values.database.auth.password | quote }}
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - {{ .Values.database.auth.username | quote }}
                - -d
                - {{ .Values.database.auth.database | quote }}
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - {{ .Values.database.auth.username | quote }}
                - -d
                - {{ .Values.database.auth.database | quote }}
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: db-data
              mountPath: /var/lib/postgresql
      volumes:
        - name: db-data
          emptyDir: {} # MMP 簡化版，生產建議使用 PVC
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "contexflow.fullname" . }}-db
  labels:
    {{- include "contexflow.labels" . | nindent 4 }}
    component: db
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.database.service.port }}
      targetPort: 5432
      protocol: TCP
      name: postgres
  selector:
    {{- include "contexflow.selectorLabels" . | nindent 4 }}
    component: db
