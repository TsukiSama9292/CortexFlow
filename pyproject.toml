[project]
name = "cortexflow"
version = "0.1.0"
description = "情報 ETL Pipeline — 從社群雜訊到結構化情報的固定管道式系統"
authors = [
    { name = "CortexFlow Contributors" },
]
requires-python = ">=3.11"
dependencies = [
    "langchain-openai>=0.3.0",
    "langchain-core>=0.3.0",
    "httpx>=0.28.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "rich>=13.0",
    "python-dotenv>=1.0",
    "trafilatura>=2.0.0",
    "loguru>=0.7.3",
]

[project.scripts]
cortexflow = "cortexflow.__main__:main"

[tool.setuptools.packages.find]
include = ["cortexflow*"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6.0",
    "pyright>=1.1.300",
    "pytest-httpx>=0.35.0",
    "respx>=0.22.0",
    "pre-commit>=4.6.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "ARG",  # flake8-unused-arguments
    "ANN",  # flake8-annotations
    "D",    # pydocstyle
    "S",    # flake8-bandit
    "BLE",  # flake8-blind-except
    "FBT",  # flake8-boolean-trap
    "A",    # flake8-builtins
    "COM",  # flake8-commas
    "C4",   # flake8-comprehensions
    "DTZ",  # flake8-datetimez
    "T20",  # flake8-print
    "Q",    # flake8-quotes
    "RET",  # flake8-return
    "SLF",  # flake8-self
    "TID",  # flake8-tidy-imports
    "TCH",  # flake8-type-checking
    "PT",   # flake8-pytest-style
    "ERA",  # eradicate
    "RUF100", # unused-noqa
]
ignore = [
    "ANN101", # Missing type annotation for self
    "ANN102", # Missing type annotation for cls
    "COM812", # Trailing comma missing (conflicts with formatter)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG", "ANN", "D", "S", "SLF"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
include = ["cortexflow", "main.py"]
typeCheckingMode = "strict"
reportMissingTypeStubs = false
# Tightening rules
reportUnknownMemberType = true
reportUnknownParameterType = true
reportUnknownVariableType = true
reportUnknownArgumentType = true
reportUntypedBaseClass = true
reportUnusedFunction = true
reportUnusedClass = true
reportUnusedVariable = true
