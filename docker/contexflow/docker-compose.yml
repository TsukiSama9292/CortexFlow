services:
  db:
    image: pgvector/pgvector:0.8.2-pg18-trixie
    environment:
      POSTGRES_DB: cortexflow
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: always

  api:
    build:
      context: ../../
      dockerfile: docker/contexflow/Dockerfile.api
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/cortexflow
    depends_on:
      - db
    labels:
      - "traefik.http.routers.api.rule=Host(`api.localhost`)"
    restart: always

  worker:
    build:
      context: ../../
      dockerfile: docker/contexflow/Dockerfile.worker
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/cortexflow
    depends_on:
      - db
    restart: always

  web:
    build:
      context: ../../
      dockerfile: docker/contexflow/Dockerfile.web
    labels:
      - "traefik.http.routers.web.rule=Host(`localhost`)"
    depends_on:
      - api
    restart: always

  traefik:
    image: traefik:v3.7.4
    command:
      - "--providers.docker=true"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    restart: always

volumes:
  db_data:
