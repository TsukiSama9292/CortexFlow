name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  quality-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node dependencies
        run: npm install

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Setup Python
        run: uv python install 3.11

      - name: Install Python dependencies (Decentralized)
        run: |
          for dir in packages/core apps/api apps/worker; do
            echo "Installing dependencies in $dir..."
            (cd $dir && uv sync)
          done

      - name: Lint (Turbo)
        run: npm run lint

      - name: Type Check (Turbo)
        run: npm run type-check

      - name: Test (Turbo)
        run: npm run test
